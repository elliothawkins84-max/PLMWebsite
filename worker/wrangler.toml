name = "plm-rfq"
main = "src/index.js"
compatibility_date = "2025-01-01"

# After deploying, set the Resend API key as a secret (never commit it):
#   wrangler secret put RESEND_API_KEY

# Per-IP rate limit for RFQ submissions: 3 per minute. (Cloudflare's
# rate limiter only supports 10s or 60s windows.)
[[ratelimits]]
name = "RFQ_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 3
  period = 60

# ---- Shared Job Log (src/joblog.js) ----
# Login attempts per IP: 5 per minute.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 5
  period = 60

# Board rows. Create once with `wrangler d1 create plm-joblog`, paste the
# database_id it prints below, then apply the schema with
# `wrangler d1 migrations apply plm-joblog --remote`.
[[d1_databases]]
binding = "JOBLOG_DB"
database_name = "plm-joblog"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Full job files. Create once with `wrangler kv namespace create JOBLOG_KV`
# and paste the id it prints below.
[[kv_namespaces]]
binding = "JOBLOG_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secret (set with `wrangler secret put JOBLOG_PASSWORD`, never committed):
#   JOBLOG_PASSWORD -- the shared log password. Every new device also needs
#   approval from the email sent to info@ (uses RESEND_API_KEY above).
