<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- <title>Business Card Editor — [Business Name]</title> -->
  <meta name="description" content="Design your own engraved business card." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="card-editor.css" />
</head>
<body class="editor-body">

  <!-- Shown only below the desktop breakpoint; the editor itself is
       hidden there via CSS (see card-editor.css). -->
  <div class="editor-mobile-block">
    <a href="products.html" class="logo logo-text"><img src="logo-text.png" alt="[Business Name]" /></a>
    <p>The business card editor needs a larger screen.<br />Please switch to a desktop or laptop computer.</p>
    <a href="products.html" class="btn btn-ghost">&larr; Back to Products</a>
  </div>

  <div class="editor-shell">
    <!-- App-style top bar (distinct from the marketing site header) -->
    <header class="editor-topbar">
      <a href="products.html" class="editor-back" aria-label="Back to Products">
        <img src="logo-mark.png" alt="[Business Name]" />
      </a>
      <span class="editor-title">Business Card Editor</span>
      <div class="editor-topbar-actions">
        <button type="button" class="editor-icon-btn" disabled aria-label="Undo">&#8630;</button>
        <button type="button" class="editor-icon-btn" disabled aria-label="Redo">&#8631;</button>
        <button type="button" class="btn btn-ghost btn-sm" disabled>Save</button>
        <button type="button" class="btn btn-sm" disabled>Export / Submit Design</button>
      </div>
    </header>

    <div class="editor-main">
      <!-- Left toolbar -->
      <nav class="editor-toolbar" aria-label="Editor tools">
        <div class="editor-tool-group">
          <button type="button" class="editor-tool is-active" disabled>
            <svg class="editor-tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M5 3l14 6-6 2-2 6-6-14z"/></svg>
            <span class="editor-tool-label">Select</span>
          </button>
          <button type="button" class="editor-tool" disabled>
            <svg class="editor-tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="5"/><line x1="12" y1="5" x2="12" y2="19"/></svg>
            <span class="editor-tool-label">Text</span>
          </button>
          <button type="button" class="editor-tool" disabled>
            <svg class="editor-tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3.5" y="8.5" width="10" height="10"/><circle cx="16" cy="8" r="4.5"/></svg>
            <span class="editor-tool-label">Shapes</span>
          </button>
          <button type="button" class="editor-tool" disabled>
            <svg class="editor-tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="4" width="18" height="16"/><circle cx="8.5" cy="9.5" r="1.4"/><path d="M21 16.5l-5.5-5.5L9 17"/></svg>
            <span class="editor-tool-label">Images</span>
          </button>
          <button type="button" class="editor-tool" disabled>
            <svg class="editor-tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M7 9l5-5 5 5"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
            <span class="editor-tool-label">Upload</span>
          </button>
        </div>

        <div class="editor-tool-divider"></div>

        <div class="editor-tool-group">
          <button type="button" class="editor-tool" disabled>
            <svg class="editor-tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="17" y2="18"/></svg>
            <span class="editor-tool-label">Align</span>
          </button>
          <button type="button" class="editor-tool" disabled>
            <svg class="editor-tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><polygon points="12,3 21,8 12,13 3,8"/><polyline points="3,14 12,19 21,14"/></svg>
            <span class="editor-tool-label">Layers</span>
          </button>
          <button type="button" class="editor-tool" disabled>
            <svg class="editor-tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="22" stroke-dasharray="2 2.4"/><line x1="2" y1="12" x2="22" y2="12" stroke-dasharray="2 2.4"/><circle cx="12" cy="12" r="3"/></svg>
            <span class="editor-tool-label">Guides</span>
          </button>
        </div>

        <div class="editor-zoom">
          <span class="editor-zoom-label">Zoom</span>
          <div class="editor-zoom-controls">
            <button type="button" class="editor-icon-btn" disabled aria-label="Zoom out">&minus;</button>
            <span class="editor-zoom-value">100%</span>
            <button type="button" class="editor-icon-btn" disabled aria-label="Zoom in">+</button>
          </div>
        </div>

        <button type="button" class="editor-help-btn" disabled aria-label="Help">?</button>
      </nav>

      <!-- Canvas -->
      <section class="editor-canvas-area">
        <div class="editor-canvas-wrap">
          <div class="editor-card" style="aspect-ratio: 86 / 54;">
            <span class="editor-card-label">Front — 86 &times; 54mm</span>
          </div>
        </div>
      </section>

      <!-- Renderings (blank for now) -->
      <aside class="editor-renderings">
        <h2>Renderings</h2>
        <p class="editor-renderings-hint">See how each finish will look here.</p>
        <div class="editor-renderings-empty"></div>
      </aside>
    </div>
  </div>

</body>
</html>
